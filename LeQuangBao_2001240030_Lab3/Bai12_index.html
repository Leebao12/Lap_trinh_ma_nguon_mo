<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: gray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h3 {
            text-align: center;
            color: black;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        #msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .msg-error {
            color: red;
        }

        .msg-success {
            color: green;
        }
    </style>
</head>

<body>

    <div class="register-container">
        <h3>Đăng Ký Tài Khoản</h3>
        <form id="regForm" onsubmit="return submitForm(event)">
            <div class="input-group">
                <input type="text" id="username" placeholder="Tên đăng nhập" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Mật khẩu (từ 6 ký tự)" required>
            </div>
            <div class="input-group">
                <input type="password" id="repassword" placeholder="Nhập lại mật khẩu" required>
            </div>
            <button type="submit">Đăng ký ngay</button>
        </form>
        <p id="msg"></p>
    </div>

    <script>
        function submitForm(event) {
            event.preventDefault();

            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;
            let repass = document.getElementById("repassword").value;
            let msgBox = document.getElementById("msg");

            msgBox.className = "";

            if (pass.length < 6) {
                msgBox.innerText = "Mật khẩu phải từ 6 ký tự trở lên!";
                msgBox.classList.add("msg-error");
                return false;
            }
            if (pass !== repass) {
                msgBox.innerText = "Mật khẩu nhập lại không khớp!";
                msgBox.classList.add("msg-error");
                return false;
            }

            msgBox.innerText = "Đang xử lý...";
            msgBox.style.color = "#7f8c8d";

            let formData = new FormData();
            formData.append('username', user);
            formData.append('password', pass);

            fetch('Bai12_register.php', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    msgBox.innerText = data.message;
                    msgBox.className = ""; 

                    if (data.status === 'success') {
                        msgBox.classList.add("msg-success");
                        document.getElementById("regForm").reset(); 
                    } else {
                        msgBox.classList.add("msg-error");
                    }
                })
                .catch(error => {
                    msgBox.innerText = "Lỗi kết nối đến máy chủ PHP!";
                    msgBox.className = "msg-error";
                    console.error(error);
                });
        }
    </script>
</body>

</html>
